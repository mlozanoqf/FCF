name: Publish Quarto syllabus

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Show Quarto version
        run: quarto --version

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare book metadata
        shell: powershell
        run: ./scripts/prepare-book-metadata.ps1

      - name: Render syllabus
        run: quarto render

      - name: Verify rendered site
        shell: pwsh
        run: |
          $requiredFiles = @(
            "docs/index.html",
            "docs/course-overview.html",
            "docs/course-activities.html",
            "docs/course-policies.html",
            "docs/schedule.html",
            "docs/references.html",
            "docs/search.json",
            "docs/.nojekyll"
          )

          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required rendered file is missing: $path"
            }
          }

          $indexHtml = [System.IO.File]::ReadAllText(
            (Resolve-Path "docs/index.html"),
            [System.Text.Encoding]::UTF8
          )

          if ($indexHtml -notmatch "Edition:") {
            throw "The rendered home page does not contain the edition metadata."
          }

          if ($indexHtml -notmatch "Published") {
            throw "The rendered home page does not contain the published metadata."
          }

          $textFiles = Get-ChildItem -Path "docs" -Recurse -File |
            Where-Object { $_.Extension -in @(".html", ".css", ".js", ".json") }

          foreach ($file in $textFiles) {
            $content = [System.IO.File]::ReadAllText(
              $file.FullName,
              [System.Text.Encoding]::UTF8
            )

            if ($content -match "fontawesome::|invisible\(NULL\)") {
              throw "A removed R or fontawesome artifact remains in $($file.FullName)."
            }
          }

          $overviewHtml = [System.IO.File]::ReadAllText(
            (Resolve-Path "docs/course-overview.html"),
            [System.Text.Encoding]::UTF8
          )

          if ($overviewHtml -match '<span class="chapter-title">index\.html</span>') {
            throw "The unwanted index.html navigation item is still present."
          }

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
